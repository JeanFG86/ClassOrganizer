name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:arch
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integração (PostgreSQL real)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: E2E (Compose completo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Subir aplicação
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Criar administrador fictício do E2E
        run: >
          printf '%s' '{"username":"e2e-admin","password":"senha ficticia e2e 2026!"}' |
          docker compose exec -T api node apps/api/src/bootstrap-admin.ts
      # Inclui os contratos e suas dependências usados para validar respostas no E2E.
      - run: pnpm install --frozen-lockfile --filter @classorganizer/e2e...
      # A imagem oficial já traz o Chromium e as bibliotecas de sistema, evitando o
      # `playwright install --with-deps` (apt-get leva ~10 min no runner).
      # A tag precisa acompanhar a versão de @playwright/test em tests/e2e/package.json.
      - name: Testes E2E (imagem oficial do Playwright)
        run: >
          docker run --rm --network host --ipc host
          -v "$PWD":/work -w /work/tests/e2e
          -e CI=true -e E2E_BASE_URL=http://localhost:8080
          mcr.microsoft.com/playwright:v1.64.1-noble
          npx --no-install playwright test
      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-diagnostico
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            compose-logs.txt
          retention-days: 7
      - if: always()
        run: docker compose down -v
