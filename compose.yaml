# Perfil de uso local: toda a aplicação no computador da escola.
#   cp .env.example .env && docker compose up -d --build
# Interface em http://localhost:8080 (somente nesta máquina por padrão).

name: classorganizer

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-app-build: &app-build
  context: .
  dockerfile: infra/docker/Dockerfile

x-database-url: &database-url postgresql://${POSTGRES_USER:-classorganizer}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-classorganizer}

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classorganizer}
      POSTGRES_USER: ${POSTGRES_USER:-classorganizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
    logging: *logging

  migrate:
    build: { <<: *app-build, target: migrate }
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    logging: *logging

  api:
    build: { <<: *app-build, target: api }
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GENERATION_TIME_LIMIT_MS: ${GENERATION_TIME_LIMIT_MS:-30000}
      GENERATION_NODE_LIMIT: ${GENERATION_NODE_LIMIT:-2000000}
      GENERATION_MEMORY_LIMIT_MB: ${GENERATION_MEMORY_LIMIT_MB:-256}
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 384M }
    logging: *logging

  worker:
    build: { <<: *app-build, target: worker }
    init: true
    restart: unless-stopped
    # Tempo para a busca em andamento voltar à fila ao parar o container (ADR 0014).
    stop_grace_period: 20s
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1G }
    logging: *logging

  web:
    build: { <<: *app-build, target: web }
    restart: unless-stopped
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }
    logging: *logging

volumes:
  pgdata:
